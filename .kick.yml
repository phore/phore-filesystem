# Kickstart container config file - see https://github.com/c7lab/kickstart
# Run ./kickstart.sh to start a development-container for this project
version: 1
from: "ghcr.io/nfra-project/kickstart-flavor-php:unstable"
secrets: open_ai

command:
  init:
    - "php -r 'if (PHP_VERSION_ID < 80500) { fwrite(STDERR, \"PHP 8.5+ required\\n\"); exit(1); }'"
    - "composer update"

  test:
    - "vendor/bin/phpunit tests/"
